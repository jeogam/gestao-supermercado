spring:
  application:
    name: gestao-supermercado-backend
  config:
    # Permite rodar localmente lendo o .env (mesmo arquivo usado pelo docker compose).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao_supermercado}
    username: ${DB_USERNAME:gestao}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Segredo HMAC (HS256) com no mínimo 32 bytes. Obrigatório: a aplicação não sobe sem ele.
      secret: ${JWT_SECRET:}
      issuer: gestao-supermercado
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    cors:
      # Origens do front separadas por vírgula (ex.: https://meu-front.com). Vazio = só mesma origem.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    login:
      max-tentativas: 5
      tempo-bloqueio: 15m
  bootstrap:
    # Cria o primeiro Superadmin somente quando ainda não existe nenhum usuário.
    admin:
      nome: ${ADMIN_NOME:Administrador}
      email: ${ADMIN_EMAIL:}
      senha: ${ADMIN_SENHA:}

server:
  # PORT é a variável que plataformas como o Render injetam. A variável SERVER_PORT (usada no .env local)
  # é lida diretamente pelo Spring e tem prioridade sobre este valor.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # liveness: só o processo (o Render reinicia a API se falhar; não pode depender do banco).
      # readiness: inclui o banco. É o alvo do ping externo, que mantém a API e o banco (Supabase pausa
      # o projeto grátis após 7 dias sem uso) ativos.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
