services:
  db:
    image: postgres:17-alpine
    container_name: gestao_supermercado_db
    environment:
      POSTGRES_DB: gestao_supermercado
      POSTGRES_USER: ${DB_USERNAME:-gestao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - gestao_supermercado_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gestao_supermercado_db_data:
